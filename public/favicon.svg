<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vmPinGrad" x1="120" y1="50" x2="390" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="vmBoltGrad" x1="220" y1="120" x2="290" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="vmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Halo -->
  <path d="M256 50 C180 50 120 110 120 186 C120 280 256 410 256 410 C256 410 392 280 392 186 C392 110 332 50 256 50 Z" 
        fill="url(#vmPinGrad)" opacity="0.3" filter="url(#vmGlow)" />

  <!-- Main Map Pin -->
  <path d="M256 50 C180 50 120 110 120 186 C120 280 256 410 256 410 C256 410 392 280 392 186 C392 110 332 50 256 50 Z" 
        fill="url(#vmPinGrad)" />

  <!-- Inner Dark Glass Disc -->
  <circle cx="256" cy="186" r="102" fill="#0b0d1b" stroke="rgba(255,255,255,0.25)" stroke-width="3" />

  <!-- Electric Bolt Icon in Center -->
  <polygon points="264,120 220,188 252,188 238,252 292,184 260,184" fill="url(#vmBoltGrad)" filter="drop-shadow(0 0 6px rgba(56,189,248,0.8))" />

  <!-- VIBEMAP Text Brand -->
  <text x="256" y="475" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="44" letter-spacing="4">VIBEMAP</text>
</svg>